<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlockWatch — Public Records Atlas</title>
    <meta
      name="description"
      content="A public-records atlas of Flock Safety / ALPR surveillance deployments across the US."
    />
    <script>
      // Applies the saved theme before first paint. Without this the page
      // renders light, then flips to dark once React mounts — a visible
      // flash on every load. Kept inline and tiny for that reason; it must
      // run before the stylesheet paints, not after a module loads.
      (function () {
        try {
          var p = localStorage.getItem("flockwatch-theme");
          if (p === "light" || p === "dark") {
            document.documentElement.setAttribute("data-theme", p);
          }
        } catch (e) {
          // Storage blocked; the CSS media query still follows the OS.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
