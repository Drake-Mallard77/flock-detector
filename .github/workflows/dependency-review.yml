name: dependency-review

# Flags newly-introduced dependencies in a PR that carry known
# vulnerabilities or incompatible licenses, before they merge — complements
# Dependabot (which flags existing deps after the fact) and govulncheck (in
# api-ci.yml, which only sees Go deps already in go.sum).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the summary comment on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
