name: Refresh public datasets

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Refresh snapshots
        run: npm run data:update
      - name: Validate snapshots
        run: npm run data:validate
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open reviewed data update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/data-refresh-${GITHUB_RUN_ID}"
          git config user.name "flock-watcher-data"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add data/
          git commit -m "data: refresh public snapshots"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "data: refresh public snapshots" --body "Automated weekly refresh. Validation passed; review the count and source changes before merging."
