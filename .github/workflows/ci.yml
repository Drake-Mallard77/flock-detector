name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm test
      - run: docker build -t flock-detector:test .
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate providers
        shell: bash
        run: |
          for stack in aws azure gcp oci; do
            terraform -chdir="infra/$stack" init -backend=false
            terraform -chdir="infra/$stack" validate
          done
