version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/services/importer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/services/api"
    schedule:
      interval: "weekly"

  # Keeps the pinned commit SHAs in .github/workflows/*.yml current via PR,
  # rather than the repo silently drifting from actions that have since
  # shipped fixes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
